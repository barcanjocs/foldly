[package]
name = "foldly"
version = "0.5.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
fastrand = "2.5.0"
lofty = "0.25.5"
natord = "1.0.9"
notify = "8.2.2"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3", "flac", "vorbis", "wav", "mp4"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
unicode-width = "0.2.3"
walkdir = "2.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
